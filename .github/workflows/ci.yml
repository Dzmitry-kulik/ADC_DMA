name: Firmware Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачивание репозитория вместе с сабмодулями
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Настройка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Авторизация в GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Сборка прошивки в Docker
      - name: Build Firmware
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifacts
          outputs: type=local,dest=./build_out
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Сохранение прошивки PMW_CONFIG.elf в артефакты GitHub Actions
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: build_out/PMW_CONFIG.elf
          retention-days: 7
